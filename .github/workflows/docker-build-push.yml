name: Build and Push Images

on:
  push:
    branches: [ main, cinema ]
    paths:
      - 'src/**'
      - '.github/workflows/docker-build-push.yml'
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: dmi-viktor/architecture-cinemaabyss

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      
      - name: Build and push monolith
        uses: docker/build-push-action@v4
        with:
          context: ./src/monolith
          push: true
          tags: |
            ghcr.io/dmi-viktor/architecture-cinemaabyss/monolith:latest
            ghcr.io/dmi-viktor/architecture-cinemaabyss/monolith:main

      - name: Build and push movies-service
        uses: docker/build-push-action@v4
        with:
          context: ./src/microservices/movies
          push: true
          tags: |
            ghcr.io/dmi-viktor/architecture-cinemaabyss/movies-service:latest
            ghcr.io/dmi-viktor/architecture-cinemaabyss/movies-service:main

      - name: Build and push events-service
        uses: docker/build-push-action@v4
        with:
          context: ./src/microservices/events
          push: true
          tags: |
            ghcr.io/dmi-viktor/architecture-cinemaabyss/events-service:latest
            ghcr.io/dmi-viktor/architecture-cinemaabyss/events-service:main

      - name: Build and push proxy-service
        uses: docker/build-push-action@v4
        with:
          context: ./src/microservices/proxy
          push: true
          tags: |
            ghcr.io/dmi-viktor/architecture-cinemaabyss/proxy-service:latest
            ghcr.io/dmi-viktor/architecture-cinemaabyss/proxy-service:main

  api-tests:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Start all services
        run: docker compose up -d --build --wait

      - name: Install newman
        run: npm install -g newman

      - name: Run API tests
        run: |
          newman run tests/postman/CinemaAbyss.postman_collection.json \
            -e tests/postman/local.environment.json --reporters cli
